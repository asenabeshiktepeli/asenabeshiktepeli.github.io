# Site content. Edit values here, then run build.py.
# Empty values ("") are hidden on the site.

meta:
  title: "Asena Beshiktepeli – E-commerce Virtual Assistant"
  description: "Remote e-commerce virtual assistant: customer support, order and shipping tracking, and clean spreadsheet data. Open to full-time roles and freelance work."
  lang: en
  url: "https://asenabeshiktepeli.github.io"  # no trailing slash; used for canonical, Open Graph, sitemap and robots.txt
  og_image: "static/og/og-image.png"  # link preview image, made by tools/make_og.py
  og_image_alt: "Asena Beshiktepeli – E-commerce Virtual Assistant & Customer Support"  # empty = meta.title
  site_name: "Asena Beshiktepeli"  # og:site_name; empty hides it

nav:
  brand: "Asena Beshiktepeli"
  items:
    - label: "Services"
      href: "#services"
    - label: "Work"
      href: "#portfolio"
    - label: "How I work"
      href: "#how-i-work"
    - label: "About"
      href: "#about"
    - label: "Contact"
      href: "#contact"

hero:
  name: "Asena Beshiktepeli"
  title: "E-commerce Virtual Assistant & Customer Support"
  value_proposition: "I help e-commerce businesses answer customers faster, track orders clearly and keep their data clean."
  availability: "Open to full-time roles · Taking freelance projects"
  local_time:
    label: "Kyrenia, Cyprus · EET (UTC+2)"
    timezone: "Europe/Nicosia"  # IANA time zone for the live clock (EET / UTC+2 in winter)
    zone_label: ""
  buttons:
    - label: "Email me"
      href: "mailto:asenabeshiktepeli@gmail.com"
    - label: "Download CV"
      href: "static/cv/Asena_Beshiktepeli_CV.pdf"
  photo: "static/img/profile-720.jpg"  # JPEG fallback (720 px, tight crop); if the file is missing, build.py falls back to the monogram
  photo_webp: "static/img/profile.webp"  # optional WebP version, used first by browsers that support it
  photo_alt: "Portrait of Asena Beshiktepeli"
  # Short trust points shown in one thin line under the hero; empty list hides it
  trust:
    - "Nearly 8 years in customer-facing sales and support"
    - "ALX Virtual Assistant certified"
    - "Google Advanced Data Analytics certified"
    - "Turkish & English"

about:
  title: "Background"  # About + Experience in one section (menu label stays "About")
  text:  # one string per paragraph
    - "I spent nearly 8 years on the customer side of a building materials and interior decoration business in Kyrenia, Cyprus: answering customers, preparing quotes, tracking orders until delivery and following up on payments."
    - "Now I bring that experience to e-commerce businesses remotely, handling customer messages, order follow-ups and clean data, so you can focus on growing your business. I also build small automations with n8n and Python to take repetitive work off your list."
    - "I'm open to a full-time remote role, and I also take on two small fixed-price setups for online shops."

services:
  title: "Services"
  items:
    - title: "Customer Support"
      text: "Clear, friendly replies to customer emails and messages, including complaints and returns."
      includes:
        - "Replies to email, chat and marketplace messages in your tone"
        - "Complaints and returns handled with clear next steps"
        - "Refunds and special cases escalated to you"
        - "AI-assisted first drafts, always reviewed before sending"
      sample: "#work-response-library"  # optional: link to a portfolio card id
    - title: "Order & Shipping Tracking"
      text: "Keeping every order visible from purchase to delivery, and following up on delays."
      includes:
        - "Daily order status check and follow-up list"
        - "Customers told about delays before they ask"
        - "Carrier follow-up on stalled parcels"
      sample: "#work-order-tracking"
    - title: "Quotes & Invoices"
      text: "Preparing quotes and proformas, tracking invoices and following up on payments."
      includes:
        - "Quotes and proformas prepared from your price list"
        - "Invoices tracked until they are paid"
        - "Polite, timely payment reminders"
      sample: ""
    - title: "Data Entry & Spreadsheet Reports"
      text: "Clean, organised spreadsheets and simple reports in Excel and Google Sheets."
      includes:
        - "Product, order and customer data entry"
        - "Duplicates and inconsistent formats cleaned up"
        - "Simple reports in Excel or Google Sheets"
      sample: "#work-data-cleanup"

# Fixed-price setups, shown under the Services cards. Empty items list hides the block.
# buy_url empty = "Email me" + "Book a 15-min call" buttons; set it to the Upwork
# Project Catalog link to show a single "Buy on Upwork ↗" button instead.
packages:
  title: "Fixed-price setups"
  intro: "Two small, fixed-scope jobs for online shops. Each one is based on a sample project you can open on this page."
  email_label: "Email me"
  buy_label: "Buy on Upwork"
  not_included_label: "Not included:"
  items:
    - title: "Order Tracking Sheet Setup"
      price: "$65 · 3–5 business days"
      text: "A Google Sheets order tracker set up for your shop, showing each order's status, shipping date and follow-up notes at a glance."
      includes:
        - "Tracker built in Google Sheets and handed over to your account"
        - "Status, shipping date and follow-up columns matched to how you work"
        - "Up to 50 existing orders moved in from your store's CSV export or entered by hand"
        - "One round of changes after delivery"
      not_included: "Daily order updates or carrier follow-up."
      sample: "#work-order-tracking"
      buy_url: ""
    - title: "Spreadsheet Cleanup"
      price: "From $40 · 3 business days"
      text: "A messy customer or order list cleaned and standardised, with every change logged so you can check it."
      includes:
        - "$40 up to 1,000 rows · $80 up to 5,000 rows"
        - "Duplicates found and flagged for your approval"
        - "Names, dates, countries and amounts in one consistent format"
        - "A change log showing what was changed"
        - "One round of changes after delivery"
      not_included: "Over 5,000 rows or more than one file (email me for a quote)."
      sample: "#work-data-cleanup"
      buy_url: ""
  note: "Sample projects use fictional data. Price and scope are confirmed by email before work starts. Files you share are used only for the job and deleted within 30 days after handover."

experience:
  title: "Experience"
  glance_context: "Cagra Co LTD, 2018–2026"  # shown after "At a glance" above the stats card; empty hides it
  items:
    - role: "Sales Consultant"
      company: "Cagra Co LTD"
      dates: "Nov 2018 – Aug 2026"
      location: "Kyrenia, Cyprus"
      summary: "Building materials and interior decoration supplies."
      # value: a number like "60%" or "120%" counts up on scroll; any other text shows as-is
      stats:
        - value: "60%"
          label: "Approximate growth in my international client base"
        - value: "120%"
          label: "Of internal sales targets reached, in multiple years"
      duties:
        - "Customer communication by email, WhatsApp, phone and face to face"
        - "Quotes and proformas"
        - "Order tracking and shipping coordination"
        - "Complaints and returns"
        - "Invoice and payment follow-up in Logo Tiger 3"
        - "Tables and reports in Excel and Google Sheets"
        - "Entry-level Logo training for new colleagues"

portfolio:
  title: "Selected work"
  intro: "Sample projects built with fictional data to show how I work."
  view_label: "View sample"  # button text (↗ is added by the template); the button only shows when an item has a link
  items:
    - title: "Customer Request Automation (n8n)"
      id: "work-request-automation"
      label: "Sample project"
      text: "A customer request form with automated follow-up. n8n creates an Asana task with priority and a due date, adds a follow-up reminder to Google Calendar and logs the request in Google Sheets. An hourly workflow marks the log as Done when the task is completed in Asana."
      tools: ["n8n", "Asana", "Google Calendar", "Google Sheets"]
      link: "https://github.com/asenabeshiktepeli/asenabeshiktepeli.github.io/tree/main/automation/n8n"
      link_label: "View on GitHub"  # optional: button text for this card instead of view_label
      # optional "downloads:" list of {label, href}: files on this site shown as download buttons
      # (the link above then becomes a small text link). None at the moment.
      # optional: a video shown instead of an image (click to play, no autoplay)
      video: "static/video/customer-request-automation.mp4"
      poster: "static/img/portfolio/customer-request-automation-poster.webp"
      poster_fallback: "static/img/portfolio/customer-request-automation-poster.jpg"  # used only if the WebP poster cannot load
    - title: "Order Tracking Sheet"
      id: "work-order-tracking"  # anchor target for links such as services "sample"
      short: "A Google Sheets tracker showing each order's status, shipping date and follow-up notes."  # grid cards: one short line; the full text sits under "Details"
      label: "Sample project"
      text: "A Google Sheets tracker that shows each order's status, shipping date and follow-up notes at a glance."
      tools: ["Google Sheets"]
      link: "https://docs.google.com/spreadsheets/d/1qmdii_crHkBCz38AoZM4wB0z7KvREubd9FTeGDE5Ieg/preview"
      image: "static/img/portfolio/order-tracking.webp"
    - title: "AI-Assisted Reply Drafting"
      id: "work-ai-drafting"
      short: "How I use AI for first drafts of customer replies and check each one against store policy before it is sent."
      label: "Sample project"
      text: "How I use AI for first drafts of customer replies, and how I check every draft against store policy before it is sent. Four examples show the AI draft, the reviewed reply and what I changed and why."
      tools: ["Google Docs", "AI assistant"]
      link: "https://docs.google.com/document/d/1uEHgSsQIdq1cHJ-TXXhwg54oFaYkwxCzJ63wrU6IX64/preview"
      image: "static/img/portfolio/ai-drafting.webp"
      screenshots:
        - src: "static/img/portfolio/ai-drafting-example-full.webp"
          alt: "AI first draft and reviewed reply for a damaged item (sample project)"
          caption: "An AI draft that promised an unapproved refund, and the reviewed reply that was sent."
        - src: "static/img/portfolio/ai-drafting-top-full.webp"
          alt: "Rules for using AI in customer support (sample project)"
          caption: "My rules: no customer data in public AI tools, policy from the store, every draft reviewed."
    - title: "Customer Support Response Library"
      id: "work-response-library"
      short: "A support playbook for a small online shop: 10 reply templates with response time targets and escalation rules."
      label: "Sample project"
      text: "A support playbook for a small online shop: 10 reply templates for order updates, delays, returns and complaints, with response time targets, escalation rules and store policy fields."
      tools: ["Google Docs"]
      link: "https://docs.google.com/document/d/1xYm1fliueMGKPDli2UzKeNNLda1rVmu8jLQrLuVwvgo/preview"
      image: "static/img/portfolio/response-library.webp"
    - title: "Data Cleanup Before/After"
      id: "work-data-cleanup"
      short: "A messy customer export cleaned with reusable formulas, with every change logged and checked."
      label: "Sample project"
      text: "A messy customer export cleaned with reusable formulas: duplicates found automatically, names split, dates, countries and amounts standardised, every change logged and every row checked against the final list."
      tools: ["Google Sheets"]
      link: "https://docs.google.com/spreadsheets/d/15lbhsX5VS6nrGrRYlrYHuI1Cgy2hru-fDLFgh4He9sY/preview"
      image: "static/img/portfolio/data-cleanup.webp"
    - title: "HubSpot Support Workflow"
      id: "work-hubspot-support"
      short: "A practice HubSpot help desk for a fictional online shop: 8 tickets moved through a pipeline and tracked on a dashboard."
      label: "Sample project"
      text: "A practice HubSpot help desk for a fictional online shop: 8 support tickets for delays, returns, refunds and damaged items, answered with reply snippets and moved through a ticket pipeline (New, Waiting on contact, Waiting on us, Closed), then tracked on a service dashboard by status, category and source. Test data and replies were loaded with Python through the HubSpot API."
      tools: ["HubSpot", "Python"]
      link: ""  # no public link – View sample button stays hidden
      image: "static/img/portfolio/hubspot-support.webp"
      # optional: full-size images shown as a gallery in a lightbox, opened (at the first one)
      # by the card image and the "View screenshots" button
      screenshots:
        - src: "static/img/portfolio/hubspot-support-full.webp"
          alt: "Screenshot of HubSpot ticket board (sample project, fictional data)"
          caption: "Ticket board"
        - src: "static/img/portfolio/hubspot-dashboard-full.webp"
          alt: "Screenshot of HubSpot Service Overview dashboard: tickets by status, category and source (sample project, fictional data)"
          caption: "Service dashboard"
    - title: "Jira Partner Support Desk"
      id: "work-jira-support"
      short: "A practice Jira Service Management desk for fictional bank and payment partners, with SLA goals for first response and resolution."
      label: "Sample project"
      text: "A practice Jira Service Management desk for fictional bank and payment partners: incidents and service requests with urgency and impact, internal notes kept separate from partner-facing replies, and SLA goals for first response and resolution that pause while waiting for the customer. The screenshots show a breached SLA, a paused SLA and an SLA met."
      tools: ["Jira Service Management"]
      link: ""  # no public link – View sample button stays hidden
      image: "static/img/portfolio/jira-support.webp"
      screenshots:
        - src: "static/img/portfolio/jira-incident-full.webp"
          alt: "Screenshot of a Jira incident with an internal note and a partner reply (sample project, fictional data)"
          caption: "Incident with internal note and reply"
        - src: "static/img/portfolio/jira-sla-paused-full.webp"
          alt: "Screenshot of Jira SLA timers paused while waiting for the customer (sample project, fictional data)"
          caption: "SLA breached and paused"
        - src: "static/img/portfolio/jira-sla-met-full.webp"
          alt: "Screenshot of a resolved Jira request with the resolution SLA met (sample project, fictional data)"
          caption: "Resolved within SLA"

how_i_work:
  title: "How I work"  # empty steps list hides the section
  steps:
    - title: "Intro call"
      text: "A 15-minute call about your tasks, tools and priorities."
    - title: "Access & setup"
      text: "You share access with the permissions you choose. I note your policies and tone of voice in a short guide, so every reply sounds like your business."
    - title: "Daily work"
      text: "I handle customer messages, order follow-ups and data tasks during our agreed hours. Refunds and special cases come to you before I reply."
    - title: "Updates"
      text: "A short end-of-day summary by email or Slack, so you always know what's done and what's open."
  cta: "Book a 15-min call"  # button next to the title (under it on phones); links to contact.booking_url (hidden if that is empty)

case_study:
  title: "Automation case study"
  name: "Python workflow with a human approval step"
  summary: "A Python workflow I built with an AI coding assistant for my own job search: it collects new listings, scores them against my criteria, drafts a tailored email for each one and waits for my approval before anything is sent. The same pattern fits repetitive business tasks such as order follow-ups or payment reminders."
  steps:
    - "Collects new items from several sources"
    - "Scores and filters them against set rules"
    - "Drafts a tailored email for each one and logs it in SQLite"
    - "Waits for my approval before anything is sent"
  highlights:
    - "900+ automated tests (pytest)"
    - "Version-controlled with Git"
    - "No email is sent without my approval"
  tech:
    - "Python"
    - "SQLite"
    - "Git"
    - "pytest"
  note: ""  # empty – stays hidden
  link: ""  # repository is not public – stays hidden
  image: ""

