hero:
  name: "Asena Beshiktepeli"
  title: "E-commerce Virtual Assistant & Customer Support"
  value_proposition: "I help e-commerce businesses answer customers faster, track orders clearly and keep their data clean."
  availability: "Available for remote work"
  local_time:
    label: "Kyrenia, Cyprus · EET (UTC+2)"
    timezone: "Europe/Nicosia"  # IANA time zone for the live clock (EET / UTC+2 in winter)
    zone_label: ""
  buttons:
    - label: "Email me"
      href: "mailto:asenabeshiktepeli@gmail.com"
    - label: "Download CV"
      href: "static/cv/Asena_Beshiktepeli_CV.pdf"
  photo: "static/img/profile.jpg"  # if the file is missing, build.py falls back to the monogram
  photo_alt: "Portrait of Asena Beshiktepeli"
  # Short trust points shown in one thin line under the hero; empty list hides it
  trust:
    - "Nearly 8 years in customer-facing sales and support"
    - "ALX Virtual Assistant certified"
    - "Google Advanced Data Analytics certified"
    - "Turkish & English"

about:
  title: "Background"  # About + Experience in one section (menu label stays "About")
  text: "I spent nearly 8 years on the customer side of a building materials and interior decoration business in Kyrenia, Cyprus: answering customers, preparing quotes, tracking orders until delivery and following up on payments. Now I bring that experience to e-commerce businesses remotely, handling customer messages, order follow-ups and clean data, so you can focus on growing your business. I also build small automations in Python to take repetitive work off your list."

services:
  title: "Services"
  items:
    - title: "Customer Support"
      text: "Clear, friendly replies to customer emails and messages, including complaints and returns."
      includes:
        - "Replies to email, chat and marketplace messages in your tone"
        - "Complaints and returns handled with clear next steps"
        - "Refunds and special cases escalated to you"
      sample: "#work-response-library"  # optional: link to a portfolio card id
    - title: "Order & Shipping Tracking"
      text: "Keeping every order visible from purchase to delivery, and following up on delays."
      includes:
        - "Daily order status check and follow-up list"
        - "Customers told about delays before they ask"
        - "Carrier follow-up on stalled parcels"
      sample: "#work-order-tracking"
    - title: "Quotes, Invoices & Payment Follow-up"
      text: "Preparing quotes and proformas and tracking invoices until they are paid."
      includes:
        - "Quotes and proformas prepared from your price list"
        - "Invoices tracked until they are paid"
        - "Polite, timely payment reminders"
      sample: ""
    - title: "Data Entry & Spreadsheet Reports"
      text: "Clean, organised spreadsheets and simple reports in Excel and Google Sheets."
      includes:
        - "Product, order and customer data entry"
        - "Duplicates and inconsistent formats cleaned up"
        - "Simple reports in Excel or Google Sheets"
      sample: "#work-data-cleanup"

experience:
  title: "Experience"
  items:
    - role: "Sales Consultant"
      company: "Cagra Co LTD"
      dates: "Nov 2018 – Aug 2026"
      location: "Kyrenia, Cyprus"
      summary: "Building materials and interior decoration supplies."
      # value: a number like "60%" or "120%" counts up on scroll; any other text shows as-is
      stats:
        - value: "60%"
          label: "About 60% growth in international clients"
        - value: "120%"
          label: "Reached 120% of internal sales targets in multiple years"
      duties:
        - "Customer communication by email, phone and face to face"
        - "Quotes and proformas"
        - "Order tracking and shipping coordination"
        - "Complaints and returns"
        - "Invoice and payment follow-up in Logo Tiger 3"
        - "Tables and reports in Excel and Google Sheets"
        - "Entry-level Logo training for new colleagues"

portfolio:
  title: "Selected work"
  intro: "Sample projects built with sample data to show how I work."
  view_label: "View sample"  # button text (↗ is added by the template); the button only shows when an item has a link
  items:
    - title: "Order Tracking Sheet"
      id: "work-order-tracking"  # anchor target for links such as services "sample"
      label: "Sample project"
      text: "A Google Sheets tracker that shows each order's status, shipping date and follow-up notes at a glance."
      tools: ["Google Sheets"]
      link: "https://docs.google.com/spreadsheets/d/1qmdii_crHkBCz38AoZM4wB0z7KvREubd9FTeGDE5Ieg/edit?usp=sharing"
      image: "static/img/portfolio/order-tracking.webp"
    - title: "Customer Support Response Library"
      id: "work-response-library"
      label: "Sample project"
      text: "A support playbook for a small online shop: 10 reply templates for order updates, delays, returns and complaints, with response time targets, escalation rules and store policy fields."
      tools: ["Google Docs"]
      link: "https://docs.google.com/document/d/1xYm1fliueMGKPDli2UzKeNNLda1rVmu8jLQrLuVwvgo/edit?usp=sharing"
      image: "static/img/portfolio/response-library.webp"
    - title: "Data Cleanup Before/After"
      id: "work-data-cleanup"
      label: "Sample project"
      text: "A messy customer export cleaned with reusable formulas: duplicates found automatically, names split, dates, countries and amounts standardised, every change logged and every row checked against the final list."
      tools: ["Google Sheets"]
      link: "https://docs.google.com/spreadsheets/d/15lbhsX5VS6nrGrRYlrYHuI1Cgy2hru-fDLFgh4He9sY/edit?usp=sharing"
      image: "static/img/portfolio/data-cleanup.webp"

how_i_work:
  title: "How I work"  # empty steps list hides the section
  steps:
    - title: "Intro call"
      text: "A 15-minute call about your tasks, tools and priorities."
    - title: "Access & setup"
      text: "You share access to the tools I need, with the permissions you choose. I write down your policies and tone of voice in a short guide, so every reply sounds like your business."
    - title: "Daily work"
      text: "I handle customer messages, order follow-ups and data tasks during our agreed hours. Refunds and special cases come to you before I reply."
    - title: "Updates"
      text: "A short end-of-day summary by email or Slack, so you always know what's done and what's open."
  cta: "Book a 15-min call"  # button under the steps; links to contact.booking_url (hidden if that is empty)

case_study:
  title: "Automation case study"
  name: "Python workflow with a human approval step"
  summary: "A personal system I built with an AI coding assistant to run my own remote job search: it collects listings, scores them, drafts tailored emails and waits for my approval before anything is sent. I can apply the same approach to repetitive business tasks such as order follow-ups or payment reminders."
  steps:
    - "Collects job listings from multiple sources"
    - "Scores and filters them against my criteria"
    - "Checks ATS compatibility"
    - "Drafts a tailored cover letter for each listing"
    - "Tracks every application in a SQLite database"
    - "Prepares email drafts and waits for my approval before sending"
  highlights:
    - "500+ automated tests"
    - "Version-controlled with Git"
    - "No email is sent without my approval"
  tech:
    - "Python"
    - "SQLite"
    - "Git"
    - "pytest"
  note: ""  # empty – stays hidden
  link: ""  # repository is not public – stays hidden
  image: ""

