about:
  title: "About"
  text:  # one string, or a list of paragraphs
    - "From 2018 to 2026 I worked as a Sales Consultant at Cagra Co LTD, handling the full customer journey: emails and phone calls, face-to-face sales, quotes and proformas, order tracking, shipping coordination, complaints and returns, and invoice and payment follow-up in Logo Tiger 3. I prepared tables and reports in Excel and trained new colleagues on Logo at entry level."
    - "Now I bring that experience to remote work, supporting e-commerce businesses with customer support and order operations. I also build my own automations in Python, including a job-search pipeline I set up with an AI coding assistant."

services:
  title: "Services"
  items:
    - title: "Customer Support"
      text: "Clear, friendly replies to customer emails and messages, including complaints and returns."
    - title: "Order & Shipping Tracking"
      text: "Keeping every order visible from purchase to delivery, and following up on delays."
    - title: "Quotes, Invoices & Payment Follow-up"
      text: "Preparing quotes and proformas and tracking invoices until they are paid."
    - title: "Data Entry & Spreadsheet Reports"
      text: "Clean, organised spreadsheets and simple reports in Excel and Google Sheets."

