faq:
  title: "FAQ"  # empty items list hides the section
  # links: turn a phrase in the answer into a link.
  #   href "booking" = contact.booking_url (new tab), "email" = mailto contact.email,
  #   "#id" = a section on this page, or any https:// URL (new tab).
  items:
    - question: "Which time zone do you work in?"
      answer: "I'm based in Kyrenia, Cyprus (EET, UTC+2). My hours are flexible and I can align with your time zone."
    - question: "Are you looking for a job or freelance work?"
      answer: "Both. I'm open to a full-time remote role, and I also take on two small fixed-price setups for online shops. Every project I accept is finished as agreed."
    - question: "Which tools do you use?"
      answer: "Everything listed under Tools I use above, mainly Google Workspace and Excel. I'm happy to learn the tools your team already uses."
      links:
        - text: "Tools I use"
          href: "#tools"
    - question: "Which languages do you speak?"
      answer: "Turkish (native) and English (B2, upper-intermediate)."
    - question: "How do we get started?"
      answer: "If you're hiring, email me or download my CV. If you run an online shop, see the fixed-price setups under Services or book a 15-minute call."
      links:
        - text: "email me"
          href: "email"
        - text: "download my CV"
          href: "static/cv/Asena_Beshiktepeli_CV.pdf"
        - text: "fixed-price setups"
          href: "#packages"
        - text: "book a 15-minute call"
          href: "booking"
    - question: "Can I see examples of your work?"
      answer: "Yes. The Selected work section has seven sample projects built with fictional data. Four include a link you can open, the HubSpot and Jira help desks are shown with screenshots, and the n8n automation is shown in a short video."
      links:
        - text: "Selected work"
          href: "#portfolio"
    - question: "How do you use AI in your work?"
      answer: "I use AI tools for first drafts, summaries and spreadsheet formulas, so routine work gets done faster. I review and edit every reply before it is sent, keep your brand's tone, and never paste customer names, emails or order details into public AI tools. I follow your company's rules on which tools are allowed."

