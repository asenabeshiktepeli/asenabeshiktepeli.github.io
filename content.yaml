about:
  title: "Background"  # About + Experience in one section (menu label stays "About")
  text: "I spent nearly 8 years on the customer side of a building materials and interior decoration business in Kyrenia, Cyprus: answering customers, preparing quotes, tracking orders until delivery and following up on payments. Now I bring that experience to e-commerce businesses remotely, handling customer messages, order follow-ups and clean data, so you can focus on growing your business. I also build small automations with n8n and Python to take repetitive work off your list. I'm open to a full-time remote role, and I also take on two small fixed-price setups for online shops."

services:
  title: "Services"
  items:
    - title: "Customer Support"
      text: "Clear, friendly replies to customer emails and messages, including complaints and returns."
      includes:
        - "Replies to email, chat and marketplace messages in your tone"
        - "Complaints and returns handled with clear next steps"
        - "Refunds and special cases escalated to you"
        - "AI-assisted first drafts, always reviewed before sending"
      sample: "#work-response-library"  # optional: link to a portfolio card id
    - title: "Order & Shipping Tracking"
      text: "Keeping every order visible from purchase to delivery, and following up on delays."
      includes:
        - "Daily order status check and follow-up list"
        - "Customers told about delays before they ask"
        - "Carrier follow-up on stalled parcels"
      sample: "#work-order-tracking"
    - title: "Quotes, Invoices & Payment Follow-up"
      text: "Preparing quotes and proformas and tracking invoices until they are paid."
      includes:
        - "Quotes and proformas prepared from your price list"
        - "Invoices tracked until they are paid"
        - "Polite, timely payment reminders"
      sample: ""
    - title: "Data Entry & Spreadsheet Reports"
      text: "Clean, organised spreadsheets and simple reports in Excel and Google Sheets."
      includes:
        - "Product, order and customer data entry"
        - "Duplicates and inconsistent formats cleaned up"
        - "Simple reports in Excel or Google Sheets"
      sample: "#work-data-cleanup"

# Fixed-price setups, shown under the Services cards. Empty items list hides the block.
# buy_url empty = "Email me" + "Book a 15-min call" buttons; set it to the Upwork
# Project Catalog link to show a single "Buy on Upwork ↗" button instead.
packages:
  title: "Fixed-price setups"
  intro: "Two small, fixed-scope jobs for online shops. Each one is based on a sample project you can open on this page."
  email_label: "Email me"
  buy_label: "Buy on Upwork"
  not_included_label: "Not included:"
  items:
    - title: "Order Tracking Sheet Setup"
      badge: "Fixed price"
      price: "$65 · 3–5 business days"
      text: "A Google Sheets order tracker set up for your shop, showing each order's status, shipping date and follow-up notes at a glance."
      includes:
        - "Tracker built in Google Sheets and handed over to your account"
        - "Status, shipping date and follow-up columns matched to how you work"
        - "Up to 50 existing orders moved in from your store's CSV export or entered by hand"
        - "One round of changes after delivery"
      not_included: "Daily order updates or carrier follow-up."
      sample: "#work-order-tracking"
      buy_url: ""
    - title: "Spreadsheet Cleanup"
      badge: "Fixed price"
      price: "From $40 · 3 business days"
      text: "A messy customer or order list cleaned and standardised, with every change logged so you can check it."
      includes:
        - "$40 up to 1,000 rows · $80 up to 5,000 rows"
        - "Duplicates found and flagged for your OK"
        - "Names, dates, countries and amounts in one consistent format"
        - "A change log showing what was changed"
        - "One round of changes after delivery"
      not_included: "Over 5,000 rows or several files: email me for a quote."
      sample: "#work-data-cleanup"
      buy_url: ""
  note: "Sample projects use fictional data. Price and scope are confirmed by email before work starts. Files you share are used only for the job and deleted within 30 days after handover."

